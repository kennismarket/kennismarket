let PDFJS=null,FDL=null;
function loadPdfJs(){
  if(PDFJS)return PDFJS;
  PDFJS=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib)}catch(e){rej(e)}};
    s.onerror=()=>{PDFJS=null;rej(new Error("pdfjs"))};document.head.appendChild(s)});
  return PDFJS;
}
function closeViewer(){const v=document.getElementById("fviewer");if(v)v.remove();document.body.style.overflow=""}
async function openViewer(href,name){
  closeViewer();
  const el=document.createElement("div");el.id="fviewer";el.className="fviewer";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
  el.innerHTML=`<div class="fv-bar"><b>${esc(name||"")}</b><span class="fv-pg muted" id="fv-pg"></span>
    <button class="btn sm" id="fv-dl">${icon("file",15)} ${tr("vDownload")}</button><button class="btn sm primary" id="fv-x">${tr("close")}</button></div>
    <div class="fv-body" id="fv-body"><div class="fv-msg">${tr("vLoading")}</div></div>`;
  document.body.appendChild(el);document.body.style.overflow="hidden";
  el.querySelector("#fv-x").onclick=closeViewer;
  const body=el.querySelector("#fv-body");
  let blob=null;
  try{const r=await fetch(href);if(!r.ok)throw new Error(r.status);blob=await r.blob()}
  catch(e){body.innerHTML=`<div class="fv-msg">${tr("vErr")}</div>`;return}
  const type=blob.type||"";
  el.querySelector("#fv-dl").onclick=async()=>{
    try{if(!FDL)FDL=await claude.use("downloads");if(!FDL)return toast(tr("vNoDl"));
      const ext=type.includes("pdf")?"pdf":(type.split("/")[1]||"pdf").replace("jpeg","jpg").replace("svg+xml","svg");
      const fn=(String(name||"arquivo").replace(/\.[a-z0-9]{2,4}$/i,"").replace(/[\\/:*?"<>|]+/g," ").trim()||"arquivo")+"."+ext;
      await FDL.save({filename:fn,data:blob})}
    catch(e){if(!e||e.code!=="declined")toast(tr("vNoDl"))}};
  if(type.startsWith("image/")){body.innerHTML=`<img class="fv-img" src="${URL.createObjectURL(blob)}" alt="">`;return}
  if(type.startsWith("video/")){body.innerHTML=`<video class="fv-img" controls src="${URL.createObjectURL(blob)}"></video>`;return}
  if(type.startsWith("text/")||type.includes("json")){const t=await blob.text();body.innerHTML=`<pre class="fv-pre">${esc(t)}</pre>`;return}
  try{
    const lib=await loadPdfJs();const buf=await blob.arrayBuffer();
    const pdf=await lib.getDocument({data:buf}).promise;
    body.innerHTML="";const pg=el.querySelector("#fv-pg");pg.textContent=tr("vPages",{n:pdf.numPages});
    const w=Math.min(body.clientWidth-24,1100);
    for(let i=1;i<=pdf.numPages;i++){
      if(!document.getElementById("fviewer"))return;
      const page=await pdf.getPage(i),v1=page.getViewport({scale:1}),scale=w/v1.width,dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=page.getViewport({scale:scale*dpr}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+"px";c.className="fv-page";
      body.appendChild(c);await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    }
  }catch(e){body.innerHTML=`<div class="fv-msg">${tr("vErrPdf")}</div>`}
}

let INVDB={},invMigrated=false;
function allInvites(){const m={};(S.invites||[]).forEach(v=>m[v.token]=v);Object.values(INVDB).forEach(v=>m[v.token]=Object.assign({},m[v.token]||{},v));return Object.values(m).sort((a,b)=>(b.created||0)-(a.created||0))}
function findInvite(t){return allInvites().find(x=>x.token===t)}
async function putInvite(v){S.invites=(S.invites||[]).filter(x=>x.token!==v.token);if(FDB){INVDB[v.token]=v;save();try{await FDB.doc("stores/inv-"+v.token).set({invite:v,ts:Date.now()})}catch(e){S.invites.unshift(v);save()}}else{S.invites.unshift(v);save()}}
async function delInvite(t){S.invites=(S.invites||[]).filter(x=>x.token!==t);delete INVDB[t];save();if(FDB){try{await FDB.doc("stores/inv-"+t).delete()}catch(e){}}}
function storesSnapshot(snap){
  const seen={};INVDB={};
  snap.docs.forEach(doc=>{if(!doc.exists)return;const x=doc.data();if(x&&x.invite&&x.invite.token)INVDB[x.invite.token]=x.invite;if(x&&x.cfg&&typeof x.cfg.supportEmail==="string"&&typeof SUPCFG!=="undefined")SUPCFG.email=x.cfg.supportEmail});

  snap.docs.forEach(doc=>{if(!doc.exists)return;const st=doc.data()&&doc.data().store;if(!st||!st.id)return;seen[st.id]=1;
    const c=JSON.parse(JSON.stringify(st));c.gen=true;c.mine=false;edSync(c);

  const first=!storesSnapshot.done;storesSnapshot.done=true;

}

function drawQR(c){
  const x=c.getContext("2d"),N=29,u=160/N;x.fillStyle="#fff";x.fillRect(0,0,160,160);x.fillStyle="#0F1B33";
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(rnd()>.52)x.fillRect(i*u,j*u,u,u);
  [[0,0],[N-7,0],[0,N-7]].forEach(([a,b])=>{x.fillStyle="#0F1B33";x.fillRect(a*u,b*u,7*u,7*u);x.fillStyle="#fff";x.fillRect((a+1)*u,(b+1)*u,5*u,5*u);x.fillStyle="#0F1B33";x.fillRect((a+2)*u,(b+2)*u,3*u,3*u)});
}

function showCrash(err){
  const msg=String(err&&(err.message||err)||"erro");try{window.__crashStack=err&&err.stack}catch(e){}
  app.innerHTML=`<div style="max-width:520px;margin:60px auto;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:grid;gap:12px">
    <b style="font-size:18px">${tr("crashT")}</b><span style="color:var(--muted)">${tr("crashD")}</span>
    <code style="font-size:12px;background:var(--bg);padding:8px 10px;border-radius:8px;word-break:break-all">${esc(msg)}</code>
    <button class="btn primary" id="crash-fix">${tr("crashFix")}</button><button class="btn" id="crash-reset">${tr("crashReset")}</button></div>`;
  document.body.style.overflow="";
  document.getElementById("crash-fix").onclick=()=>{try{S.view="explorar";S.chatBig=false;S.edit=null;S.draft=null;S.trv=null;save()}catch(e){}location.hash="";location.reload()};
  document.getElementById("crash-reset").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.hash="";location.reload()};
}
window.addEventListener("error",e=>{if(app&&!app.children.length)showCrash(e.error||e.message)});

async function spxSet(id,v){
  const st=shopById(id)||(S.myStore&&S.myStore.id===id?S.myStore:null);if(!st)return;
  if(v===null){delete st.split}else{v=Math.round(+v);if(!(v>=0&&v<=100)){toast(tr("spxErr"));return}st.split=v}
  if(S.myStore&&S.myStore.id===id){if(v===null)delete S.myStore.split;else S.myStore.split=v}
  try{await persistStore(st);save();rerenderKeep();toast(v===null?tr("spxRemoved",{s:st.n}):tr("spxSaved",{s:st.n,n:v}))}catch(e){toast(tr("fErr"))}
}

function supRules(){

${supKB()}`;

var SCAM=/(golp[eiao]|golpist|scam|fraud|estaf|oplicht|bedrieg|enganad|me roubaram|roubo)/i;
function scamFlag(s,o,text){
  S.cases=S.cases||[];if(S.cases.some(c=>c.kind==="scam"&&c.sid===(s&&s.id)&&c.status==="open"))return;
  S.cases.unshift({id:"G"+Date.now().toString(36).slice(-5).toUpperCase(),kind:"scam",sid:s?s.id:null,oid:o?o.id:null,amount:o?o.amount||o.reserve||0:0,r:"scam",t:String(text).slice(0,400),ts:Date.now(),status:"open"});save();
}
function supStrip(t){return String(t).replace(/\[\[(EMAIL|TERMOS|REEMBOLSO)\]\]/g,"").replace(/\n{3,}/g,"\n\n").trim()}
function supCanned(q,txt,ms){
  const M=supMsgs();M.push({r:"u",t:q});const a={r:"a",t:""};M.push(a);SUPBUSY=true;supRefresh();
  setTimeout(()=>{a.t=txt;a.mail=true;SUPBUSY=false;supRefresh()},ms);
}
async function supAsk(q){
  q=String(q||"").trim();if(!q||SUPBUSY)return;
  if(SCAM.test(q)){scamFlag(null,null,q);return supCanned(q,tr("m_scam"),2600+Math.random()*1200)}
  if(!SAMPLE)return supCanned(q,tr("supOff"),1400+Math.random()*800);
  const M=supMsgs();M.push({r:"u",t:q});const a={r:"a",t:""};M.push(a);while(M.length>30)M.shift();
  SUPBUSY=true;save();supRefresh();
  const turns=[{role:"user",content:supRules()}];
  M.slice(-13,-1).forEach(m=>{if(m.t)turns.push({role:m.r==="u"?"user":"assistant",content:m.t})});
  SUPCTL=new AbortController();
  try{
    const {text}=await SAMPLE(turns,{cache:false,modelTier:"quick",signal:SUPCTL.signal,onText:({text})=>{a.t=supStrip(text);const el=document.querySelectorAll("#supmsgs .supa .msg");if(el.length)el[el.length-1].innerHTML=supFmt(a.t)}});
    a.mail=/\[\[EMAIL\]\]/.test(text);a.docs=["termos","reembolso"].filter(k=>new RegExp("\\[\\["+k.toUpperCase()+"\\]\\]").test(text));a.t=supStrip(text);
  }catch(e){
    if(e&&(e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="not_declared"||e.code==="capability_disabled"))SAMPLE=null;
    a.t=(e&&e.text)||tr(e&&e.code==="rate_limited"?"supBusy":"supErr");a.mail=true;
  }finally{SUPBUSY=false;SUPCTL=null;save();supRefresh()}
}

  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast(tr("accPicBad"));if(f.size>15e6)return toast(tr("accPicBig"));
    const url=URL.createObjectURL(f),img=new Image();
    img.onload=()=>{const N=240,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d"),s=Math.min(img.width,img.height);
      x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,N,N);URL.revokeObjectURL(url);
      let d;try{d=c.toDataURL("image/webp",.85);if(!/^data:image\/webp/.test(d))d=c.toDataURL("image/jpeg",.85)}catch(e){return toast(tr("accPicBad"))}
      accUser().photo=d;save();render();toast(tr("accPicOk"))};
    img.onerror=()=>{URL.revokeObjectURL(url);toast(tr("accPicBad"))};img.src=url};
  inp.click();
}

var GS_CC={nl:["NL","BE"],en:["GB","US","CA","IE"],es:["ES"],pt:["PT","BR"]};
function genStore(){
  const base=genStoreRandom(),prev=S.draft&&S.draft.src,curId=S.draft&&S.draft.id;
  const loaded=Object.keys(FILES||{}).length>0;
  const hasFiles=(s,lg)=>s.prods.every(p=>prodFiles(p,lg).length>0);
  const langsOf=s=>loaded?Object.keys(GS_CC).filter(l=>hasFiles(s,l)):(GS_CC[slang(s)]?[slang(s)]:[]);
  let cands=SHOPS.filter(s=>!s.mine&&s.id!==curId&&!s.src&&Array.isArray(s.prods)&&s.prods.length&&s.id>=300000&&langsOf(s).length);
  if(!cands.length)return base;
  if(cands.length>1&&prev)cands=cands.filter(s=>s.id!==prev);
  const src=cands[Math.floor(Math.random()*cands.length)];
  const ls=langsOf(src),lg=ls.includes(slang(src))?slang(src):ls[Math.floor(Math.random()*ls.length)];
  const ccs=GS_CC[lg],cc=ccs[Math.floor(Math.random()*ccs.length)];
  base.cc=cc;base.city=genCity(cc);base.n=genName(cc);base.o=genPerson(cc);base.lockLoc=true;
  /* Loja nova nasce sem vendas: fica fora do catálogo (só aparece pesquisando) até ser verificada (10 vendas) */
  Object.assign(base,{sales:0,reviews:0,rating:0,ver:true});S.elg=lg;
  const nn=base.n,olds=[src.n,src.o].filter(x=>x&&x.length>2);
  const swap=v=>typeof v==="string"?olds.reduce((t,o)=>t.split(o).join(nn),v):Array.isArray(v)?v.map(swap):v;
  const k=Math.floor(Math.random()*3);
  const desc=GS_LANGS.map((l,i)=>{const d=swap(Array.isArray(src.desc)?src.desc[i]:src.desc)||"";return (GS_INTRO[l][k].replace("{n}",nn)+" "+d).trim()});
  const prods=JSON.parse(JSON.stringify(src.prods));   // mesmos ids → mesmos PDFs
  return Object.assign(base,{src:src.id,c:src.c,niche:src.niche,tl:JSON.parse(JSON.stringify(src.tl||base.tl)),h:swap(JSON.parse(JSON.stringify(src.h))),desc,
    prods,tiers:prods.map(p=>[p.name,p.desc,p.price,1])});
}

/* =========================================================
   Link do vendedor (afiliado)
   - O link #convite-<token> nunca expira.
   - 1ª vez: cria usuário e senha → gera a loja.
   - Depois: sempre pede usuário e senha → painel da loja (ou gerar loja, se ainda não gerou).
   - Senha esquecida: o dono gera um novo link no Painel do dono (a loja vai junto).
   Conta fica em db "sellers/acc-<token>" (PROTÓTIPO: senha com hash SHA-256 + salt).
   ========================================================= */
var SELLERS={},SELL_READY=false,SELL_AUTHED=null;
function invTokFromHash(){const m=(location.hash||"").match(/^#convite-([a-z0-9]+)$/);return m?m[1]:null}
function sellAcc(t){return SELLERS[t]||((S.sellerAccts||{})[t])||null}
async function sellHash(salt,pw){
  const txt=salt+"|"+pw;
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=5381;for(const c of txt)h=((h<<5)+h+c.charCodeAt(0))>>>0;return "x"+h.toString(16)}
}
async function sellPut(t,acc){
  SELLERS[t]=acc;
  if(FDB){await FDB.doc("sellers/acc-"+t).set({acc,ts:Date.now()});return}
  S.sellerAccts=Object.assign({},S.sellerAccts||{},{[t]:acc});save();
}
async function sellDel(t){delete SELLERS[t];if(S.sellerAccts){delete S.sellerAccts[t];save()}if(FDB){try{await FDB.doc("sellers/acc-"+t).delete()}catch(e){}}}
function sellAttachStores(){
  Object.values(SELLERS).forEach(a=>{if(!a||!a.store||!a.store.id)return;if(S.myStore&&S.myStore.id===a.store.id)return;
    if(typeof DBSTORES!=="undefined"&&DBSTORES[a.store.id])return;
    const c=Object.assign(JSON.parse(JSON.stringify(a.store)),{gen:true,mine:false});const i=SHOPS.findIndex(x=>x.id===c.id);if(i>=0)SHOPS[i]=c;else SHOPS.push(c)});
}
(function sellInit(){
  let tries=0;const iv=setInterval(()=>{tries++;
    if(FDB){clearInterval(iv);FDB.collection("sellers").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists){const x=d.data();if(x&&x.acc&&x.acc.token)m[x.acc.token]=x.acc}});SELLERS=m;
      const first=!SELL_READY;SELL_READY=true;sellAttachStores();if(first||invTokFromHash()||S.view==="admin"){const y=window.scrollY;render();window.scrollTo(0,y)}},()=>{SELL_READY=true;render()});return}
    if(tries>25){clearInterval(iv);SELL_READY=true;if(invTokFromHash())render()}
  },200);
})();
function invReady(){return !FDB||(typeof storesSnapshot!=="undefined"&&storesSnapshot.done)}

      <div class="av-coin hide-m" aria-hidden="true">${coinBig(150)}</div>
      <div class="in"><div class="logo">Kennismarket<span>.</span></div>
        <div class="atext"><span class="h2eyebrow">${tr("slKick")}</span><h1>${esc(tr("slTitle"))}</h1>
          <ul class="aperks hide-m">
            <li>${icon("lock",18)}<div><b>${tr("slP1t")}</b><span>${tr("slP1d")}</span></div></li>

}
async function sellSubmit(f){
  const t=f.dataset.t,mode=f.dataset.mode,err=document.getElementById("sl-err"),btn=f.querySelector("button[type=submit]");
  const un=document.getElementById("sl-user").value.trim().replace(/^@/,"").toLowerCase(),pw=document.getElementById("sl-pass").value;
  err.textContent="";
  if(!/^[a-z0-9_.]{3,20}$/.test(un))return err.textContent=tr("accUserH");
  if(mode==="login"){
    const acc=sellAcc(t);if(!acc||acc.username!==un)return err.textContent=tr("slWrong");
    if(await sellHash(acc.salt,pw)!==acc.hash)return err.textContent=tr("slWrong");
    return sellEnter(t,acc);
  }
  if(pw.length<8)return err.textContent=tr("slPassH");
  if(pw!==document.getElementById("sl-pass2").value)return err.textContent=tr("slMismatch");
  const taken=Object.values(SELLERS).some(a=>a&&a.username===un&&a.token!==t);
  if(mode==="new"&&taken)return err.textContent=tr("slTaken");
  btn.disabled=true;
  const old=sellAcc(t)||{},salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
  const acc=Object.assign({},old,{token:t,username:mode==="reset"?old.username:un,salt,hash:await sellHash(salt,pw),created:old.created||Date.now(),pwAt:Date.now()});
  try{await sellPut(t,acc)}catch(e){btn.disabled=false;return err.textContent=tr("slSaveErr")}
  sellEnter(t,acc);
}
function sellEnter(t,acc){
  SELL_AUTHED=t;
  seed({name:acc.username,full:acc.username,username:acc.username,email:""},false);
  S.user.role="vendedor";S.user.sellerTok=t;S.invTok=t;
  if(acc.store){
    const st=Object.assign(JSON.parse(JSON.stringify(acc.store)),{mine:true});delete st.gen;
    const i=SHOPS.findIndex(x=>x.id===st.id);if(i>=0)SHOPS.splice(i,1);
    S.myStore=st;attachMyStore();S.tab="loja";save();
    history.replaceState(null,"",location.pathname+location.search+"#minhaloja");S.view="minhaloja";
  } else {S.draft=null;save();S.view="convite"}
  document.body.classList.add("app");scheduleAll();render();window.scrollTo(0,0);toast(tr("welcome",{n:acc.username}));
}
async function sellSaveStore(st){
  const t=S.user&&S.user.sellerTok;if(!t||!st)return;
  const acc=sellAcc(t);if(!acc)return;
  const c=JSON.parse(JSON.stringify(st));delete c.mine;delete c.gen;
  try{await sellPut(t,Object.assign({},acc,{storeId:c.id,store:c,storeAt:Date.now()}))}catch(e){toast(tr("slSaveErr"))}
}

var _renderBase=render;
render=function(soft){
  const t=invTokFromHash();
  if(t&&(!(S.user&&S.user.sellerTok===t&&SELL_AUTHED===t)||(SELL_READY&&!sellAcc(t)&&S.user&&S.user.sellerTok===t))){document.body.classList.remove("app");return renderSellerAuth(t)}
  if(S.user&&S.user.sellerTok&&S.view==="convite"&&S.myStore){S.view="minhaloja";history.replaceState(null,"",location.pathname+location.search+"#minhaloja")}

};
(function(){
  const pub=A.pubstore;
  A.pubstore=el=>{const had=S.myStore;pub(el);if(S.myStore&&S.myStore!==had)sellSaveStore(S.myStore)};

  const edp=A.edpublish;

  if(typeof persistStore==="function"){const ps=persistStore;persistStore=async function(st){const r=await ps(st).catch(e=>{if(!(S.user&&S.user.sellerTok))throw e;return false});if(S.myStore&&st&&st.id===S.myStore.id)sellSaveStore(S.myStore);return r}}

  /* Senha esquecida: novo link, mesma conta e mesma loja; o link antigo para de funcionar. */
  A.sellreset=async el=>{
    const t=el.dataset.t,v=findInvite(t),acc=sellAcc(t);if(!acc)return;
    const nt=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

    await sellPut(nt,Object.assign({},acc,{token:nt,salt:null,hash:null,resetFrom:t,resetAt:Date.now()}));
    await sellDel(t);await delInvite(t);render();toast(tr("slResetOk"));
  };
})();

  });
  /* tocar em enviar não fecha o teclado */
  const keep=e=>{const b=e.target.closest&&e.target.closest("body.km-wa .composer button");if(b&&isIn(document.activeElement))e.preventDefault()};
  document.addEventListener("mousedown",keep,true);document.addEventListener("pointerdown",keep,true);
  /* abrir o chat no celular não abre o teclado sozinho (igual WhatsApp) */
  if(typeof A!=="undefined"&&A.startchat){const sc=A.startchat;A.startchat=function(){const r=sc.apply(this,arguments);if(matchMedia("(max-width:760px)").matches){const a=document.activeElement;if(isIn(a))a.blur()}return r}}
})();
</script>

<script id="km-soft">
/* Atualiza o chat sem recriar o campo de digitar: o teclado não fecha nem pula quando chega mensagem */
function kmSoftSet(box,html){
  const live=box.querySelector("form.composer");
  if(!live){box.innerHTML=html;return}
  const tmp=document.createElement("div");tmp.innerHTML=html;
  const nf=tmp.querySelector("form.composer");
  if(!nf||nf.id!==live.id){box.innerHTML=html;return}
  const li=live.querySelector("input"),ni=nf.querySelector("input");if(li&&ni&&li.placeholder!==ni.placeholder)li.placeholder=ni.placeholder;
  [...box.childNodes].forEach(n=>{if(n!==live)n.remove()});
  const kids=[...tmp.childNodes],k=kids.indexOf(nf);
  kids.slice(0,k).forEach(n=>box.insertBefore(n,live));
  let ref=live.nextSibling;kids.slice(k+1).forEach(n=>box.insertBefore(n,ref));
}
/* tocar em enviar não tira o foco do campo (o teclado fica aberto) */
document.addEventListener("touchstart",e=>{const b=e.target.closest&&e.target.closest("body.km-wa form.composer button");if(!b)return;const f=b.form,i=f&&f.querySelector("input");if(!i||document.activeElement!==i)return;e.preventDefault();try{f.requestSubmit()}catch(x){f.dispatchEvent(new Event("submit",{cancelable:true,bubbles:true}))}},{passive:false,capture:true});
</script>

<script id="km-one-prod">
/* Loja nova começa com 1 produto só; o vendedor adiciona outros se quiser */
(function(){const g0=genStore;genStore=function(){const d=g0.apply(this,arguments);if(d&&Array.isArray(d.prods)&&d.prods.length>1){d.prods=d.prods.slice(0,1);d.tiers=d.prods.map(p=>[p.name,p.desc,p.price,1])}return d}})();
</script>

<style id="km-toast">
/* Avisos rápidos discretos: pílula escura pequena em vez do balão branco */
.toast{background:color-mix(in srgb,var(--surface) 92%,transparent)!important;color:var(--ink)!important;border:1px solid var(--line);padding:7px 14px!important;font-size:13px!important;font-weight:500!important;line-height:1.3;border-radius:999px!important;box-shadow:0 6px 20px -8px rgba(0,0,0,.5)!important;width:max-content;max-width:min(320px,calc(100% - 48px))!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:kmToast 2.8s ease both;pointer-events:none}
@keyframes kmToast{0%{opacity:0;transform:translate(-50%,6px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
</style>

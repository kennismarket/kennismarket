<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kennismarket</title>
<script>/* tema padrão: escuro */document.documentElement.setAttribute("data-theme","dark")</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Playfair+Display:wght@800&family=Bebas+Neue&family=Pacifico&family=Abril+Fatface&family=Righteous&family=DM+Serif+Display&family=Archivo+Black&family=Permanent+Marker&family=Comfortaa:wght@700&family=Cinzel:wght@700&family=Space+Grotesk:wght@700&family=Lobster&family=Josefin+Sans:wght@700&family=Fredoka:wght@600&family=Caveat:wght@700&display=swap">
<style>
/* Layout: grade modular, sóbria (escola holandesa de design): barra fixa, vitrine em cartões, loja em duas colunas (conteúdo | atendimento) que vira abas no celular */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#EAEFF4; --ink:#102A43; --muted:#526579; --line:#DAE2EA;
  --primary:#102A43; --on-primary:#FFFFFF; --primary-soft:#E2E9F0;
  --safe:#16805D; --safe-soft:#E0F2EA; --neg:#D92D20; --lock:#B54708; --out:#2563EB; --brand:#102A43; --warn:#8F5300; --warn-soft:#FBEFD9; --danger:#B42318; --danger-soft:#FCE9E7;
  --accent:#E2601A; --shadow:0 1px 2px rgba(15,27,51,.05),0 10px 30px -18px rgba(15,27,51,.35);
  --f-display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1622; --surface:#122233; --surface-2:#182B3F; --ink:#E7EEF5; --muted:#9DB0C3; --line:#24384E;
  --primary:#A9C3DE; --on-primary:#0B1622; --primary-soft:#1B3047;
  --safe:#3FBF8F; --safe-soft:#11301F; --neg:#FF6B5E; --lock:#F5A54A; --out:#7AA7FF; --brand:#163A5C; --warn:#E8B45E; --warn-soft:#352812; --danger:#F08A80; --danger-soft:#3A1715;
  --accent:#F0874B; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1622; --surface:#122233; --surface-2:#182B3F; --ink:#E7EEF5; --muted:#9DB0C3; --line:#24384E;
  --primary:#A9C3DE; --on-primary:#0B1622; --primary-soft:#1B3047;
  --safe:#3FBF8F; --safe-soft:#11301F; --neg:#FF6B5E; --lock:#F5A54A; --out:#7AA7FF; --brand:#163A5C; --warn:#E8B45E; --warn-soft:#352812; --danger:#F08A80; --danger-soft:#3A1715;
  --accent:#F0874B; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance;line-height:1.1}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.ic{flex:none;vertical-align:middle}
.ph{background:var(--warn-soft);color:var(--warn);padding:0 4px;border-radius:4px;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;line-height:1.2;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.safe{background:var(--safe);border-color:var(--safe);color:var(--on-primary)}
.btn.ghost{background:none;border-color:transparent;color:var(--primary);padding-inline:8px}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Faixa de demonstração */
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.4}
.demo .wrap{padding-block:7px;display:flex;gap:8px;align-items:flex-start}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.04em;color:var(--primary);background:none;border:0;padding:0;line-height:1}
.logo span{color:var(--safe)}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;position:relative}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.nav .dotn{position:absolute;top:6px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.grow{flex:1}
.wallet-pill{display:flex;align-items:center;gap:2px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);padding:3px}
.wallet-pill .bal{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 10px;font-weight:600}
.wallet-pill .bal small{color:var(--muted);font-weight:500;font-size:12.5px}
.wallet-pill .add{border:0;background:var(--primary);color:var(--on-primary);border-radius:999px;width:30px;height:30px;display:grid;place-items:center;font-size:18px;font-weight:600;line-height:1}
.me-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;display:grid;place-items:center}
@media (max-width:760px){.nav{display:none}.wallet-pill .bal small{display:none}.top .wrap{gap:10px}}

/* Barra inferior (celular) */
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
  .tabbar button[aria-current="page"]{color:var(--primary)}
  .tabbar .dotn{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
  body.app{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
}

/* Selos e pílulas */
.vf{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--safe);background:var(--safe-soft);padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;border:0;line-height:1.3}
.new{display:inline-flex;align-items:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--primary-soft);color:var(--primary)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.safe{background:var(--safe-soft);color:var(--safe)}
.pill.off{background:var(--surface-2);color:var(--muted)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-display);font-size:16px;flex:none;letter-spacing:.02em}
.av.lg{width:72px;height:72px;border-radius:18px;font-size:26px}
.av.sm{width:36px;height:36px;border-radius:10px;font-size:13px}
.stars{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.stars .ic{color:#E6A700}

/* Explorar */
.intro{padding-block:36px 8px;display:grid;gap:14px}
.intro h1{font-size:clamp(30px,4.6vw,48px);font-weight:800;max-width:20ch}
.intro p{color:var(--muted);max-width:60ch;font-size:16.5px}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;padding-block:20px 8px}
.trust div{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.trust .ic{color:var(--safe);margin-top:2px}
.trust b{display:block;font-size:14.5px}
.trust span{font-size:13.5px;color:var(--muted)}
.searchbar{position:relative;max-width:640px}
.searchbar .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbar input{width:100%;padding:14px 16px 14px 44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
.searchbar input:focus{outline:none;border-color:var(--primary)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:20px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:14px}
.toggle{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.toggle input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.toggle input:checked{background:var(--safe)}
.toggle input:checked::after{transform:translateX(16px)}
.select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0;color:var(--ink)}
.card:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px)}
.card .head{display:flex;gap:12px;align-items:flex-start;min-width:0}
.card .head>div{min-width:0}
.card .name{font-weight:700;font-size:16px;line-height:1.25;display:block}
.card .who{font-size:13px;color:var(--muted)}
.card .hl{font-size:14.5px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.card .stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);align-items:center}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto;font-size:13.5px}
.card .foot b{font-family:var(--f-mono);font-size:14px;color:var(--ink)}
.more{display:flex;justify-content:center;padding-block:24px 8px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;display:grid;gap:10px;justify-items:center}
.section{padding-block:40px 8px}
.section>h2{font-size:clamp(22px,3vw,30px);font-weight:700;margin-bottom:18px}
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;counter-reset:s}
.steps4>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px;align-content:start}
.steps4>div::before{counter-increment:s;content:counter(s);font-family:var(--f-mono);font-weight:600;font-size:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);margin-bottom:6px}
.steps4 b{font-size:15.5px}
.steps4 p{font-size:14px;color:var(--muted)}
.band{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
.band .seal{width:56px;height:56px;border-radius:16px;background:var(--safe-soft);color:var(--safe);display:grid;place-items:center}
.band h3{font-size:20px;margin-bottom:4px}
.band p{color:var(--muted);font-size:14.5px;max-width:62ch}
@media (max-width:700px){.band{grid-template-columns:1fr}}

/* Loja */
.crumbs{padding-block:18px 6px}
.seg{display:none}
@media (max-width:980px){
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted);position:relative}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .seg .dotn{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
}
.store{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start;padding-bottom:40px}
@media (max-width:980px){
  .store{grid-template-columns:minmax(0,1fr)}
  .store[data-tab="loja"] .atend{display:none}
  .store[data-tab="chat"] .smain{display:none}
}
.smain{display:grid;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0}
.panel>h2{font-size:20px;font-weight:700;margin-bottom:4px}
.panel>.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.shead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.shead h1{font-size:clamp(24px,3.4vw,34px);font-weight:800}
.shead .line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:8px;color:var(--muted);font-size:14px}
.shead .hl{margin-top:12px;font-size:16px;max-width:60ch}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
.kpis div{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.kpis b{font-family:var(--f-mono);font-size:17px;font-weight:600;display:flex;align-items:center;gap:5px}
.kpis span{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.shead{grid-template-columns:1fr}}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.tiers{display:grid;gap:10px}
.tier{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;align-items:start}
.tier b{font-size:15.5px}
.tier p{font-size:14px;color:var(--muted);grid-column:1}
.tier .pr{grid-row:1/span 2;grid-column:2;text-align:right;display:grid;gap:2px}
.tier .pr b{font-family:var(--f-mono);font-size:16px}
.tier .pr span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.note{font-size:13.5px;color:var(--muted);margin-top:12px;display:flex;gap:8px;align-items:flex-start}
.port{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.port{grid-template-columns:1fr}}
.ptile{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;background:var(--surface)}
.ptile .art{aspect-ratio:16/10;max-width:100%;position:relative;overflow:hidden}
.ptile .art i{position:absolute;display:block;background:rgba(255,255,255,.9);border-radius:4px}
.ptile .meta{padding:12px 14px;display:grid;gap:2px}
.ptile .meta b{font-size:14.5px;line-height:1.3}
.ptile .meta span{font-size:13px;color:var(--muted)}
.ptile .meta em{font-style:normal;font-size:13px;color:var(--safe);font-weight:600}
.rev-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;margin-bottom:16px}
.rev-big{display:grid;gap:2px;justify-items:start}
.rev-big b{font-family:var(--f-mono);font-size:40px;line-height:1}
.bars{display:grid;gap:5px}
.bars div{display:grid;grid-template-columns:14px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.bars i{height:7px;border-radius:9px;background:var(--surface-2);position:relative;overflow:hidden;display:block}
.bars i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:#E6A700;border-radius:9px}
.rev{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:4px}
.rev .who{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;flex-wrap:wrap}
.rev p{font-size:14.5px}
.tag-ex{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.facts div{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.facts .ic{color:var(--safe);margin-top:2px}

/* Atendimento / chat */
.atend{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);height:calc(100dvh - 110px);max-height:780px;min-height:520px;overflow:hidden}
@media (max-width:980px){.atend{position:static;height:calc(100dvh - 190px);min-height:540px;max-height:none}.guard{padding:10px 12px;gap:8px}.stepper{padding-top:10px}}
.demo .s{display:none}
@media (max-width:760px){.demo .l{display:none}.demo .s{display:inline}}
.ahead{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ahead b{display:block;font-size:15px;line-height:1.2}
.ahead span{font-size:12.5px;color:var(--muted)}
.online{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--safe);margin-right:5px}
.online.off{background:var(--line)}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:12px 16px 0}
.stepper div{font-size:11.5px;font-weight:600;color:var(--muted);border-top:3px solid var(--line);padding-top:6px;line-height:1.2}
.stepper .done{border-color:var(--safe);color:var(--safe)}
.stepper .cur{border-color:var(--primary);color:var(--ink)}
.guard{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:var(--safe-soft);display:grid;gap:10px}
.guard.wait{background:var(--primary-soft)}
.guard.att{background:var(--warn-soft)}

const FAQ={
en:[["What are KN Coins?","They’re how you pay on Kennismarket. 1 KN Coin is worth €1.00. You buy them with iDEAL, card, PayPal or Pix and use them to buy from stores. KN Coins aren’t an investment and don’t earn interest."],
 ["Why do I reserve KN Coins before getting a quote?","So the seller knows you have the balance and can spend time on your case. Reserving doesn’t pay anyone: Kennismarket holds the KN Coins, and you can cancel and get them back anytime before picking an option."],
 ["When does the seller get paid?","Only after you approve the delivery. If you don’t reply, KN Coins are released automatically 7 days after delivery. Until then, you can ask for changes or open a dispute."],
 ["Can I get my money back?","Yes. KN Coins you haven’t used can be refunded as money: in full and without giving a reason within 14 days of purchase, and after that for up to 90 days. The refund goes to the original payment method."],
 ["What if the delivery isn’t what we agreed?","Open a dispute within 7 days of delivery. The KN Coins stay locked, the Kennismarket team reviews the accepted quote, the conversation and the delivery, and decides within 5 business days. If the delivery doesn’t match the quote, you get your KN Coins back, fully or partly."],
 ["Can a seller ask me to pay outside Kennismarket?","No. That’s not allowed on Kennismarket. Payments outside the platform have no guarantee and no refund. If someone asks, report it to support."],
 ["What does the “Verified” badge mean?","The store’s identity was confirmed, it has at least 10 completed sales and keeps an average rating of 4.5 or higher. The badge shows track record and reliability, but doesn’t guarantee results."],
 ["Do sellers need to be professionals?","No. Anyone with useful knowledge can sell, after our review. What matters is the quote: it says exactly what you’ll get, and you only pay after approving it."],
 ["Can anyone guarantee I’ll make money?","No. Nobody can guarantee profit or income. Promises of guaranteed income are forbidden on Kennismarket. If you see one, report it."]],
es:[["¿Qué son los KN Coins?","Son la forma de pago en Kennismarket. 1 KN Coin vale 1 €. Los compras con iDEAL, tarjeta, PayPal o Pix y los usas para comprar en las tiendas. Los KN Coins no son una inversión y no generan intereses."],
 ["¿Por qué reservo KN Coins antes de recibir la propuesta?","Para que el vendedor sepa que tienes saldo y pueda dedicar tiempo a tu caso. Reservar no le paga a nadie: Kennismarket guarda los KN Coins, y puedes cancelar y recuperarlos cuando quieras antes de elegir una opción."],
 ["¿Cuándo cobra el vendedor?","Solo después de que apruebes la entrega. Si no respondes, los KN Coins se liberan automáticamente 7 días después de la entrega. Hasta entonces, puedes pedir cambios o abrir una disputa."],
 ["¿Puedo recuperar mi dinero?","Sí. Los KN Coins que no usaste se pueden reembolsar en dinero: completos y sin dar motivo en hasta 14 días desde la compra, y después durante hasta 90 días. El reembolso va al medio de pago original."],
 ["¿Y si la entrega no es lo que acordamos?","Abre una disputa en hasta 7 días desde la entrega. Los KN Coins quedan bloqueados, el equipo de Kennismarket revisa la propuesta aceptada, la conversación y la entrega, y decide en hasta 5 días hábiles. Si la entrega no coincide con la propuesta, recuperas tus KN Coins, total o parcialmente."],
 ["¿Un vendedor puede pedirme pagar fuera de Kennismarket?","No. Eso está prohibido en Kennismarket. Los pagos fuera de la plataforma no tienen garantía ni reembolso. Si alguien te lo pide, denúncialo a soporte."],
 ["¿Qué significa el sello “Verificada”?","Se confirmó la identidad de la tienda, tiene al menos 10 ventas completadas y mantiene una nota media de 4,5 o más. El sello muestra historial y fiabilidad, pero no garantiza resultados."],
 ["¿Los vendedores tienen que ser profesionales?","No. Cualquier persona con conocimientos útiles puede vender, tras nuestra revisión. Lo importante es la propuesta: dice exactamente qué recibirás, y solo pagas después de aprobarla."],
 ["¿Alguien puede garantizar que voy a ganar dinero?","No. Nadie puede garantizar ganancias o ingresos. Las promesas de ingresos garantizados están prohibidas en Kennismarket. Si ves una, denúnciala."]],
pt:[["O que são KN Coins?","São a forma de pagamento dentro do Kennismarket. 1 KN Coin vale € 1,00. Você compra com iDEAL, cartão, PayPal ou Pix e usa para comprar nas lojas. KN Coins não são investimento e não rendem."],
 ["Por que preciso reservar KN Coins antes da proposta?","Para o vendedor saber que você tem saldo e investir tempo no seu caso. A reserva não paga ninguém: os KN Coins ficam guardados pelo Kennismarket, e você pode cancelar e receber de volta a qualquer momento antes de escolher uma opção."],
 ["Quando o vendedor recebe?","Só depois que você aprova a entrega. Se você não responder, a liberação é automática 7 dias após a entrega. Até lá, você pode pedir ajuste ou abrir uma disputa."],
 ["Posso pedir meu dinheiro de volta?","Sim. KN Coins que você não usou podem ser devolvidos em dinheiro: de forma integral e sem justificativa em até 14 dias após a compra, e depois disso por até 90 dias. A devolução vai para o mesmo meio de pagamento."],
 ["E se a entrega não for o que combinamos?","Abra uma disputa em até 7 dias após a entrega. Os KN Coins ficam bloqueados, a equipe Kennismarket analisa a proposta aceita, a conversa e a entrega, e decide em até 5 dias úteis. Se a entrega não corresponder à proposta, os KN Coins voltam para você, total ou parcialmente."],
 ["O vendedor pode me pedir pagamento por fora?","Não. Isso é proibido no Kennismarket. Pagamentos por fora não têm garantia nem reembolso. Se alguém pedir, denuncie pelo suporte."],
 ["O que significa o selo “Verificada”?","A loja teve a identidade confirmada, concluiu pelo menos 10 vendas e mantém nota média igual ou acima de 4,5. O selo mostra histórico e confiabilidade, mas não garante resultado."],
 ["Os vendedores precisam ser profissionais?","Não. Qualquer pessoa com um conhecimento útil pode vender, depois da nossa análise. O que importa é a proposta: ela diz exatamente o que você vai receber, e você só paga depois de aprovar."],
 ["Alguém garante que eu vou ganhar dinheiro?","Não. Ninguém pode garantir lucro ou renda. Promessas de ganho garantido são proibidas no Kennismarket. Se encontrar uma, denuncie."]]

const MAP4=(arr,fn)=>arr.map((s,i)=>fn(s,i));
function genProducts(){
  const ni=NICHES[Math.floor(Math.random()*NICHES.length)],x=ni[2];
  let types=Object.keys(PTYPES).filter(k=>(!PTYPES[k].food||ni[1])&&(!PTYPES[k].nofood||!ni[1]));
  types=types.sort(()=>Math.random()-.5);
  const lead=ni[1]?"menu":"prices";if(Math.random()<.7&&!types.slice(0,3).includes(lead)){types=types.filter(k=>k!==lead);types.unshift(lead)}
  const n=3+Math.floor(Math.random()*3),chosen=types.slice(0,n);
  const prods=chosen.map(k=>{const t=PTYPES[k],top=t.topics?t.topics[Math.floor(Math.random()*t.topics.length)]:null;
    const price=Math.round((t.pr[0]+Math.random()*(t.pr[1]-t.pr[0]))/5)*5;
    return {type:k,name:MAP4(t.name,(s,i)=>s.replace("{x}",x[i]).replace("{t}",top?top[i]:"")),desc:t.desc,price,deliv:t.deliv}});
  return {niche:ni[0],x,prods,cat:PTYPES[chosen[0]].cat,h:MAP4(PSTORE_HL,(s,i)=>s.replace("{x}",x[i])),desc:MAP4(PSTORE_DESC,(s,i)=>s.replace("{x}",x[i]))};
}

en:`<p class="ver">Draft · updated October 20, 2026</p>
<p class="draft">Draft for legal review before publishing. Highlighted fields must be filled in.</p>
<h2>1. What Kennismarket is</h2>
<p>Kennismarket is an online marketplace where people and businesses (“Buyers”) buy knowledge, services and digital content from independent people (“Sellers”). Kennismarket is operated by ${PH("legal name")}, registration no. ${PH("number")}, ${PH("address")}, contact ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}.</p>
<p>Kennismarket facilitates the purchase and holds KN Coins until each order is completed. Sellers provide the services and are responsible for what they offer and deliver.</p>
<h2>2. Your account</h2>
<ul><li>You must be 18 or older and legally able to enter into contracts.</li><li>The information you give must be true and kept up to date.</li><li>One account per person. You’re responsible for keeping your password safe.</li><li>We may ask you to confirm your identity for security and fraud prevention.</li></ul>
<h2>3. KN Coins</h2>
<ul><li>KN Coins are how you pay on Kennismarket. 1 KN Coin equals €1.00.</li><li>KN Coins are bought with iDEAL, card, PayPal or Pix through ${"Asaas"}. If you pay in another currency, the conversion rate is shown before you pay.</li><li>KN Coins are not money, an investment or a financial product. They don’t earn interest and can only be used to buy on Kennismarket.</li><li>Unused KN Coins can be refunded under the Refund policy.</li></ul>
<h2>4. How an order works</h2>
<ul><li><b>Reservation:</b> the Buyer reserves KN Coins to start. Reserved KN Coins are held in the Kennismarket Guarantee: they leave the available balance but don’t go to the Seller.</li>
<li><b>Quote:</b> the Seller sends a quote in the chat with options, price in KN Coins, what will be delivered and the deadline.</li>
<li><b>Choice:</b> when the Buyer picks an option, its price stays protected in the Kennismarket Guarantee and the difference goes back to the Buyer’s balance.</li>
<li><b>Delivery:</b> when the Seller delivers what the Buyer chose, the KN Coins are released and split between the Seller and Kennismarket. From that moment, refunds are no longer automatic: the Buyer can open a support case within 7 days, and the Kennismarket team reviews it.</li>
<li>The quote accepted in the chat defines what was bought and is the basis for reviewing disputes.</li></ul>
<h2>5. Rules of conduct</h2>
<p>On Kennismarket it is forbidden to:</p>
<ul><li>arrange payment outside the platform or exchange contact details to do so;</li><li>promise guaranteed profit, income or financial results;</li><li>sell content you don’t have the rights to, such as other authors’ e-books;</li><li>offer pyramid schemes, gambling, investments or illegal products;</li><li>post offensive, discriminatory or misleading content, or content that infringes other people’s rights;</li><li>create fake accounts or manipulate reviews or sales numbers.</li></ul>
<p>Breaking these rules may lead to a warning, suspension or closure of the account, without prejudice to other legal measures.</p>
<h2>6. Sellers</h2>
<ul><li>Anyone 18 or older can apply to sell. No degree or company is required. Every application is reviewed, including identity.</li><li>The “Verified” badge means the store’s identity was confirmed, it has at least 10 completed sales and an average rating of 4.5 or higher. The badge is not a guarantee of results.</li><li>KN Coins received can be converted into money in the seller area, with a service fee of 15%, as set out in the Seller rules.</li><li>Sellers are responsible for their own taxes, invoices and legal obligations in their country.</li></ul>
<h2>7. Seller guarantee</h2>
<p>If a Buyer receives what they ordered and then tries not to pay — for example by disputing the card payment (chargeback), asking their bank for an undue reversal or using someone else’s payment details — Kennismarket pays the Seller their share of the order, as long as the delivery was made through the platform and matches what was agreed. The Seller doesn’t need to chase the Buyer: Kennismarket takes over the collection.</p>
<p>Receiving a product or service and refusing to pay in bad faith may constitute a crime (such as fraud) and is a breach of these terms. In those cases Kennismarket may suspend or close the Buyer’s account, keep the evidence (chat, deliveries and payments) and take the appropriate legal action, including reporting the case to the authorities, to recover the amount.</p>
<h2>8. Disputes</h2>
<p>A dispute can be opened within 7 days of delivery. The Kennismarket team reviews the accepted quote, the conversation and the delivery, may ask both sides for information, and decides within 5 business days: full, partial or no refund to the Buyer (refunds approved after delivery are paid by Kennismarket). Disliking a delivery that matches the accepted quote is not, on its own, grounds for a refund.</p>
<h2>9. Kennismarket’s responsibilities</h2>
<p>Kennismarket runs the platform, holds KN Coins during each order, handles disputes and protects personal data. Kennismarket does not guarantee financial or business results from the services bought.</p>
<h2>10. Intellectual property</h2>
<p>Usage rights for delivered content are those set out in the quote. Unless agreed otherwise, the Buyer gets a license for personal use or use in their own business, without the right to resell.</p>
<h2>11. Changes to these terms</h2>
<p>We may change these terms. We’ll let you know by email and on the site at least 15 days in advance. Changes don’t affect orders already in progress.</p>
<h2>12. Applicable law</h2>
<p>These terms are governed by the laws of ${"the Netherlands"}. Nothing in these terms limits the mandatory consumer rights you have under the law of the country where you live, such as EU consumer protection rules or the Brazilian Consumer Defense Code.</p>`,
es:`<p class="ver">Borrador · actualizado el 20 de octubre de 2026</p>
<p class="draft">Borrador para revisión legal antes de publicar. Los campos destacados deben completarse.</p>

<p>Kennismarket es un marketplace online donde personas y empresas (“Compradores”) compran conocimiento, servicios y contenido digital a personas independientes (“Vendedores”). Kennismarket es operado por ${PH("razón social")}, registro n.º ${PH("número")}, ${PH("dirección")}, contacto ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}.</p>
<p>Kennismarket facilita la compra y guarda los KN Coins hasta que se completa cada pedido. Los Vendedores prestan los servicios y responden por lo que ofrecen y entregan.</p>
<h2>2. Tu cuenta</h2>
<ul><li>Debes tener 18 años o más y capacidad legal para contratar.</li><li>La información que des debe ser verdadera y mantenerse actualizada.</li><li>Una cuenta por persona. Eres responsable de cuidar tu contraseña.</li><li>Podemos pedirte que confirmes tu identidad por seguridad y prevención de fraude.</li></ul>
<h2>3. KN Coins</h2>
<ul><li>Los KN Coins son la forma de pago en Kennismarket. 1 KN Coin equivale a 1 €.</li><li>Los KN Coins se compran con iDEAL, tarjeta, PayPal o Pix a través de ${"Asaas"}. Si pagas en otra moneda, el tipo de cambio se muestra antes del pago.</li><li>Los KN Coins no son dinero, inversión ni producto financiero. No generan intereses y solo sirven para comprar en Kennismarket.</li><li>Los KN Coins no usados se pueden reembolsar según la Política de reembolso.</li></ul>
<h2>4. Cómo funciona un pedido</h2>
<ul><li><b>Reserva:</b> el Comprador reserva KN Coins para empezar. Los KN Coins reservados quedan en la Garantía Kennismarket: salen del saldo disponible, pero no van al Vendedor.</li>
<li><b>Propuesta:</b> el Vendedor envía por chat una propuesta con opciones, precio en KN Coins, qué se entregará y el plazo.</li>
<li><b>Elección:</b> al elegir una opción, su precio queda protegido en la Garantía Kennismarket y la diferencia vuelve al saldo del Comprador.</li>
<li><b>Entrega:</b> cuando el Vendedor entrega lo que el Comprador eligió, los KN Coins se liberan y se reparten entre el Vendedor y Kennismarket. Desde ese momento, el reembolso deja de ser automático: el Comprador puede abrir un caso con soporte en hasta 7 días, y el equipo de Kennismarket lo revisa.</li>
<li>La propuesta aceptada en el chat define lo que se compró y es la base para revisar disputas.</li></ul>
<h2>5. Reglas de conducta</h2>
<p>En Kennismarket está prohibido:</p>
<ul><li>acordar pagos fuera de la plataforma o intercambiar datos de contacto para hacerlo;</li><li>prometer ganancias, ingresos o resultados financieros garantizados;</li><li>vender contenido sin tener los derechos, como e-books de otros autores;</li><li>ofrecer esquemas piramidales, apuestas, inversiones o productos ilegales;</li><li>publicar contenido ofensivo, discriminatorio, engañoso o que infrinja derechos de terceros;</li><li>crear cuentas falsas o manipular reseñas o números de ventas.</li></ul>
<p>El incumplimiento puede llevar a una advertencia, suspensión o cierre de la cuenta, sin perjuicio de otras medidas legales.</p>
<h2>6. Vendedores</h2>
<ul><li>Cualquier persona de 18 años o más puede solicitar vender. No se exige título ni empresa. Cada solicitud se revisa, incluida la identidad.</li><li>El sello “Verificada” indica que se confirmó la identidad de la tienda, que tiene al menos 10 ventas completadas y una nota media de 4,5 o más. El sello no garantiza resultados.</li><li>Los KN Coins recibidos se pueden convertir en dinero en el área del vendedor, con una comisión de servicio del 15%, según las Reglas para vendedores.</li><li>Los Vendedores son responsables de sus impuestos, facturas y obligaciones legales en su país.</li></ul>
<h2>7. Garantía al vendedor</h2>
<p>Si un Comprador recibe lo que pidió e intenta no pagar —por ejemplo, impugnando el pago con tarjeta (contracargo), pidiendo a su banco una devolución indebida o usando datos de pago de otra persona—, Kennismarket paga al Vendedor su parte del pedido, siempre que la entrega se haya hecho por la plataforma y corresponda a lo acordado. El Vendedor no necesita cobrar al Comprador: Kennismarket se encarga del cobro.</p>
<p>Recibir un producto o servicio y negarse a pagar de mala fe puede constituir un delito (como estafa) y es un incumplimiento de estos términos. En esos casos, Kennismarket puede suspender o cerrar la cuenta del Comprador, conservar las pruebas (chat, entregas y pagos) y emprender las acciones legales correspondientes, incluida la denuncia ante las autoridades, para recuperar el importe.</p>
<h2>8. Disputas</h2>
<p>Se puede abrir una disputa en hasta 7 días desde la entrega. El equipo de Kennismarket revisa la propuesta aceptada, la conversación y la entrega, puede pedir información a ambas partes y decide en hasta 5 días hábiles: reembolso total, parcial o ninguno al Comprador (los reembolsos aprobados tras la entrega los paga Kennismarket). Que no guste una entrega que coincide con la propuesta aceptada no es, por sí solo, motivo de reembolso.</p>
<h2>9. Responsabilidades de Kennismarket</h2>
<p>Kennismarket mantiene la plataforma, guarda los KN Coins durante cada pedido, gestiona las disputas y protege los datos personales. Kennismarket no garantiza resultados financieros o comerciales de los servicios comprados.</p>
<h2>10. Propiedad intelectual</h2>
<p>Los derechos de uso del contenido entregado son los definidos en la propuesta. Salvo acuerdo distinto, el Comprador recibe una licencia de uso personal o para su propio negocio, sin derecho de reventa.</p>
<h2>11. Cambios en estos términos</h2>
<p>Podemos cambiar estos términos. Avisaremos por correo y en el sitio con al menos 15 días de antelación. Los cambios no afectan a pedidos en curso.</p>
<h2>12. Ley aplicable</h2>
<p>Estos términos se rigen por las leyes de ${"los Países Bajos"}. Nada en estos términos limita los derechos del consumidor obligatorios en el país donde vives, como las normas de protección al consumidor de la UE o el Código de Defensa del Consumidor de Brasil.</p>`,

en:`<p class="ver">Draft · updated October 20, 2026</p>
<div class="sum"><b>Summary</b><span>You never lose KN Coins for a service you didn’t receive. KN Coins you haven’t used can be refunded as money, and sellers only get paid when they deliver what you chose.</span></div>
<h2>1. KN Coins you haven’t used</h2>
<div class="tablewrap"><table><thead><tr><th>When</th><th>What happens</th></tr></thead><tbody>
<tr><td>Up to 14 days after purchase</td><td>Full refund, no reason needed.</td></tr>
<tr><td>15 to ${PH("90")} days after purchase</td><td>Full refund of the KN Coins you haven’t used yet.</td></tr></tbody></table></div>
<p style="margin-top:10px">The 14-day period meets or exceeds the legal withdrawal period in the European Union (14 days) and in Brazil (7 days). To request a refund, go to <b>Wallet → Request a refund</b>. Every request is reviewed by support, which checks that the KN Coins were not used, to protect sellers from fraud.</p>
<h2>2. KN Coins reserved at a store</h2>
<ul><li><b>Before picking an option from the quote:</b> cancel whenever you want. The KN Coins go back to your balance right away.</li><li><b>After picking:</b> if the delivery deadline passes with no delivery, you can cancel the order and get the KN Coins back.</li></ul>
<h2>3. Delivery not as agreed</h2>
<p>Open a dispute within 7 days of delivery. The KN Coins stay locked during the review. The Kennismarket team decides within 5 business days. If the delivery doesn’t match the accepted quote, you get the KN Coins back, fully or partly.</p>
<h2>4. When there’s no refund</h2>
<p>KN Coins released to the seller at delivery, unless support approves a refund after reviewing a case opened within 7 days of delivery. This doesn’t limit any mandatory consumer rights you have where you live.</p>
<p class="fineprint">Not liking a delivery that matches the accepted quote is not, on its own, grounds for a refund. In these cases, support reviews each request individually, based on the quote, the conversation and what was delivered, and may decide on a full, partial or no refund. Accounts that repeatedly ask for refunds after receiving deliveries may have new reservations limited.</p>
<h2>5. How and when you get the money</h2>
<ul><li>Refunds go to the payment method used for the purchase, in the currency you paid in.</li><li><b>Pix:</b> within 2 business days.</li><li><b>Card and PayPal:</b> we request the refund within 2 business days. It shows up according to your provider’s timeline.</li></ul>
<h2>6. Contact</h2><p>Questions about refunds: ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}.</p>`,
es:`<p class="ver">Borrador · actualizado el 20 de octubre de 2026</p>
<div class="sum"><b>Resumen</b><span>Nunca pierdes KN Coins por un servicio que no recibiste. Los KN Coins que no usaste se pueden reembolsar en dinero, y el vendedor solo cobra cuando entrega lo que elegiste.</span></div>
<h2>1. KN Coins que no usaste</h2>
<div class="tablewrap"><table><thead><tr><th>Cuándo</th><th>Qué pasa</th></tr></thead><tbody>
<tr><td>Hasta 14 días después de la compra</td><td>Reembolso total, sin necesidad de dar motivo.</td></tr>
<tr><td>De 15 a ${PH("90")} días después de la compra</td><td>Reembolso total de los KN Coins que aún no usaste.</td></tr></tbody></table></div>
<p style="margin-top:10px">El plazo de 14 días cumple o supera el plazo legal de desistimiento de la Unión Europea (14 días) y de Brasil (7 días). Para pedirlo, ve a <b>Cartera → Solicitar devolución</b>. Cada solicitud la revisa soporte, que comprueba que los KN Coins no se usaron, para proteger a los vendedores de fraudes.</p>
<h2>2. KN Coins reservados en una tienda</h2>
<ul><li><b>Antes de elegir una opción de la propuesta:</b> cancela cuando quieras. Los KN Coins vuelven a tu saldo al instante.</li><li><b>Después de elegir:</b> si pasa el plazo de entrega sin entrega, puedes cancelar el pedido y recuperar los KN Coins.</li></ul>
<h2>3. Entrega distinta a lo acordado</h2>
<p>Abre una disputa en hasta 7 días desde la entrega. Los KN Coins quedan bloqueados durante la revisión. El equipo de Kennismarket decide en hasta 5 días hábiles. Si la entrega no coincide con la propuesta aceptada, recuperas los KN Coins, total o parcialmente.</p>
<h2>4. Cuándo no hay reembolso</h2>
<p>KN Coins liberados al vendedor en la entrega, salvo que soporte apruebe un reembolso tras revisar un caso abierto en hasta 7 días desde la entrega. Esto no limita los derechos del consumidor obligatorios donde vives.</p>
<p class="fineprint">Que no te guste una entrega que coincide con la propuesta aceptada no es, por sí solo, motivo de reembolso. En estos casos, soporte revisa cada solicitud de forma individual, según la propuesta, la conversación y lo entregado, y puede decidir un reembolso total, parcial o ninguno. Las cuentas que piden reembolsos repetidamente después de recibir entregas pueden tener limitadas nuevas reservas.</p>
<h2>5. Cómo y cuándo recibes el dinero</h2>
<ul><li>El reembolso va al medio de pago usado en la compra, en la moneda en que pagaste.</li><li><b>Pix:</b> en hasta 2 días hábiles.</li><li><b>Tarjeta y PayPal:</b> pedimos el reembolso en hasta 2 días hábiles. Aparece según los plazos de tu proveedor.</li></ul>
<h2>6. Contacto</h2><p>Dudas sobre reembolsos: ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}.</p>`,
pt:`<p class="ver">Rascunho · atualizado em 20/10/2026</p>
<div class="sum"><b>Resumo</b><span>Você nunca perde KN Coins por um serviço que não recebeu. KN Coins que você não usou podem voltar em dinheiro, e o vendedor só recebe quando entrega o que você escolheu.</span></div>
<h2>1. KN Coins que você não usou</h2>
<div class="tablewrap"><table><thead><tr><th>Quando</th><th>O que acontece</th></tr></thead><tbody>
<tr><td>Até 14 dias após a compra</td><td>Devolução integral, sem precisar justificar.</td></tr>
<tr><td>De 15 a ${PH("90")} dias após a compra</td><td>Devolução integral dos KN Coins que ainda não foram usados.</td></tr></tbody></table></div>
<p style="margin-top:10px">O prazo de 14 dias cumpre ou supera o prazo legal de arrependimento da União Europeia (14 dias) e do Brasil (7 dias, art. 49 do CDC). Para pedir, acesse <b>Carteira → Solicitar devolução</b>. Todo pedido passa pela análise do suporte, que confere se os KN Coins não foram usados, para proteger os vendedores contra fraudes.</p>
<h2>2. KN Coins reservados em uma loja</h2>
<ul><li><b>Antes de escolher uma opção da proposta:</b> cancele quando quiser. Os KN Coins voltam para o seu saldo na hora.</li><li><b>Depois de escolher:</b> se o prazo de entrega passar sem entrega, você pode cancelar o pedido e receber os KN Coins de volta.</li></ul>
<h2>3. Entrega diferente do combinado</h2>
<p>Abra uma disputa em até 7 dias após a entrega. Os KN Coins ficam bloqueados durante a análise. A equipe Kennismarket decide em até 5 dias úteis. Se a entrega não corresponder à proposta aceita, os KN Coins voltam para você, total ou parcialmente.</p>
<h2>4. Quando não há devolução</h2>
<p>KN Coins liberados ao vendedor na entrega, a não ser que o suporte aprove uma devolução depois de analisar um chamado aberto em até 7 dias após a entrega. Isso não limita os direitos obrigatórios do consumidor no país onde você mora.</p>
<p class="fineprint">Não gostar de uma entrega que corresponde à proposta aceita não é, por si só, motivo para reembolso. Nesses casos, o suporte analisa cada pedido individualmente, com base na proposta, na conversa e no que foi entregue, e pode decidir por devolução total, parcial ou nenhuma. Contas que pedem reembolso repetidamente depois de receber entregas podem ter novas reservas limitadas.</p>
<h2>5. Prazo e forma da devolução</h2>
<ul><li>A devolução vai para o mesmo meio de pagamento usado na compra, na moeda em que você pagou.</li><li><b>Pix:</b> em até 2 dias úteis.</li><li><b>Cartão e PayPal:</b> pedimos o estorno em até 2 dias úteis. Ele aparece conforme o prazo da operadora.</li></ul>
<h2>6. Contato</h2><p>Dúvidas sobre reembolso: ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}.</p>`}},
privacidade:{t:["Privacy policy","Política de privacidad","Política de privacidade"],h:{
en:`<p class="ver">Draft · updated October 20, 2026 · written to meet the GDPR (EU) and the LGPD (Brazil)</p>
<p class="draft">Draft for legal review. Fill in the controller, the data protection officer and, if needed, the EU representative before publishing.</p>
<h2>1. Who looks after your data</h2>
<p>Controller: ${PH("legal name")}, ${PH("registration no.")}, ${PH("address")}. Data protection officer: ${PH("name")}, ${PH("email")}. EU representative (GDPR art. 27): ${PH("name and address, if applicable")}.</p>
<h2>2. Data we collect</h2>
<ul><li><b>Account:</b> name, email and password (stored encrypted).</li><li><b>Payments:</b> processed by ${"Asaas"}. We don’t store your full card details.</li><li><b>Platform use:</b> chat messages, orders, quotes, deliveries and reviews.</li><li><b>Technical data:</b> IP address, device type and essential cookies.</li></ul>
<h2>3. Why we use it and the legal basis</h2>
<div class="tablewrap"><table><thead><tr><th>Purpose</th><th>Legal basis</th></tr></thead><tbody>
<tr><td>Create your account, process orders and payments</td><td>Performance of a contract</td></tr>
<tr><td>Keep tax and access records</td><td>Legal obligation</td></tr>
<tr><td>Security, fraud prevention and dispute review</td><td>Legitimate interests</td></tr>
<tr><td>News by email</td><td>Consent (you can withdraw it anytime)</td></tr></tbody></table></div>
<h2>4. Who we share it with</h2>
<ul><li>The seller you chat with: your name and the messages in that conversation.</li><li>The payment processor and hosting providers, only what’s needed.</li><li>Authorities, when required by law.</li></ul>
<p>We don’t sell your data. Your data may be processed in countries other than yours; when that happens, we use the safeguards required by law, such as standard contractual clauses.</p>
<h2>5. How long we keep it</h2>
<p>While your account is active. After it’s closed, only for as long as the law requires, such as tax and access records.</p>
<h2>6. Your rights</h2>
<p>You can ask for access, correction, deletion, portability, restriction or objection to processing, information about who we share data with, and withdrawal of consent. Write to ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}. We reply within 15 days. You can also complain to your data protection authority, such as your EU supervisory authority or Brazil’s ANPD.</p>
<h2>7. Security</h2><p>We use encrypted connections (HTTPS), hashed passwords and restricted access to data within the team.</p>
<h2>8. Cookies</h2><p>We use essential cookies to keep you signed in. Advertising cookies only with your consent.</p>`,
es:`<p class="ver">Borrador · actualizado el 20 de octubre de 2026 · redactado para cumplir el RGPD (UE) y la LGPD (Brasil)</p>
<p class="draft">Borrador para revisión legal. Completa el responsable, el delegado de protección de datos y, si aplica, el representante en la UE antes de publicar.</p>
<h2>1. Quién cuida tus datos</h2>
<p>Responsable: ${PH("razón social")}, ${PH("n.º de registro")}, ${PH("dirección")}. Delegado de protección de datos: ${PH("nombre")}, ${PH("correo")}. Representante en la UE (art. 27 RGPD): ${PH("nombre y dirección, si aplica")}.</p>
<h2>2. Datos que recogemos</h2>
<ul><li><b>Cuenta:</b> nombre, correo y contraseña (guardada cifrada).</li><li><b>Pagos:</b> procesados por ${"Asaas"}. No guardamos los datos completos de tu tarjeta.</li><li><b>Uso de la plataforma:</b> mensajes del chat, pedidos, propuestas, entregas y reseñas.</li><li><b>Datos técnicos:</b> dirección IP, tipo de dispositivo y cookies esenciales.</li></ul>
<h2>3. Para qué los usamos y con qué base legal</h2>
<div class="tablewrap"><table><thead><tr><th>Finalidad</th><th>Base legal</th></tr></thead><tbody>
<tr><td>Crear tu cuenta, procesar pedidos y pagos</td><td>Ejecución de un contrato</td></tr>
<tr><td>Guardar registros fiscales y de acceso</td><td>Obligación legal</td></tr>
<tr><td>Seguridad, prevención de fraude y revisión de disputas</td><td>Interés legítimo</td></tr>
<tr><td>Novedades por correo</td><td>Consentimiento (puedes retirarlo cuando quieras)</td></tr></tbody></table></div>
<h2>4. Con quién los compartimos</h2>
<ul><li>Con el vendedor con quien hablas: tu nombre y los mensajes de esa conversación.</li><li>Con el procesador de pagos y los proveedores de alojamiento, solo lo necesario.</li><li>Con las autoridades, cuando la ley lo exija.</li></ul>
<p>No vendemos tus datos. Tus datos pueden tratarse en países distintos al tuyo; en ese caso usamos las garantías que exige la ley, como cláusulas contractuales tipo.</p>
<h2>5. Cuánto tiempo los guardamos</h2>
<p>Mientras tu cuenta esté activa. Después de cerrarla, solo el tiempo que exija la ley, como registros fiscales y de acceso.</p>
<h2>6. Tus derechos</h2>
<p>Puedes pedir acceso, rectificación, supresión, portabilidad, limitación u oposición al tratamiento, información sobre con quién compartimos datos y retirar tu consentimiento. Escribe a ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}. Respondemos en hasta 15 días. También puedes reclamar ante tu autoridad de protección de datos, como la autoridad de control de tu país en la UE o la ANPD de Brasil.</p>
<h2>7. Seguridad</h2><p>Usamos conexión cifrada (HTTPS), contraseñas con hash y acceso restringido a los datos dentro del equipo.</p>
<h2>8. Cookies</h2><p>Usamos cookies esenciales para mantener tu sesión. Cookies de publicidad solo con tu consentimiento.</p>`,
pt:`<p class="ver">Rascunho · atualizado em 20/10/2026 · escrito para atender ao GDPR (UE) e à LGPD (Lei 13.709/2018)</p>
<p class="draft">Rascunho para revisão jurídica. Preencha o controlador, o encarregado e, se for o caso, o representante na UE antes de publicar.</p>
<h2>1. Quem cuida dos seus dados</h2>
<p>Controlador: ${PH("razão social")}, ${PH("nº de registro")}, ${PH("endereço")}. Encarregado de dados (DPO): ${PH("nome")}, ${PH("e-mail")}. Representante na UE (art. 27 do GDPR): ${PH("nome e endereço, se aplicável")}.</p>
<h2>2. Dados que coletamos</h2>
<ul><li><b>Cadastro:</b> nome, e-mail e senha (guardada de forma criptografada).</li><li><b>Pagamentos:</b> processados por ${"Asaas"}. Não guardamos os dados completos do seu cartão.</li><li><b>Uso da plataforma:</b> mensagens do chat, pedidos, propostas, entregas e avaliações.</li><li><b>Dados técnicos:</b> endereço IP, tipo de dispositivo e cookies essenciais.</li></ul>
<h2>3. Para que usamos e com qual base legal</h2>
<div class="tablewrap"><table><thead><tr><th>Finalidade</th><th>Base legal</th></tr></thead><tbody>
<tr><td>Criar sua conta, processar pedidos e pagamentos</td><td>Execução de contrato</td></tr>
<tr><td>Guardar registros fiscais e de acesso</td><td>Cumprimento de obrigação legal</td></tr>
<tr><td>Segurança, prevenção de fraudes e análise de disputas</td><td>Legítimo interesse</td></tr>
<tr><td>Envio de novidades por e-mail</td><td>Consentimento (você pode cancelar quando quiser)</td></tr></tbody></table></div>
<h2>4. Com quem compartilhamos</h2>
<ul><li>Com o vendedor com quem você conversa: seu nome e as mensagens dessa conversa.</li><li>Com o processador de pagamentos e com provedores de hospedagem, apenas o necessário.</li><li>Com autoridades, quando a lei exigir.</li></ul>
<p>Não vendemos seus dados. Seus dados podem ser tratados em outros países; nesse caso, usamos as garantias exigidas por lei, como cláusulas contratuais padrão.</p>
<h2>5. Por quanto tempo guardamos</h2>
<p>Enquanto sua conta estiver ativa. Depois do encerramento, apenas pelo prazo exigido por lei, como registros fiscais e de acesso.</p>
<h2>6. Seus direitos</h2>
<p>Você pode pedir: confirmação e acesso, correção, anonimização ou eliminação, portabilidade, oposição ou limitação do tratamento, informação sobre com quem compartilhamos e revogação do consentimento. Peça pelo e-mail ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}. Respondemos em até 15 dias. Você também pode reclamar à autoridade de proteção de dados, como a ANPD no Brasil ou a autoridade do seu país na UE.</p>
<h2>7. Segurança</h2><p>Usamos conexão criptografada (HTTPS), senhas protegidas por hash e acesso restrito aos dados dentro da equipe.</p>
<h2>8. Cookies</h2><p>Usamos cookies essenciais para manter você conectado. Cookies de publicidade só com o seu consentimento.</p>`}},
regras:{t:["Seller rules","Reglas para vendedores","Regras para vendedores"],h:{
en:`<p class="ver">Draft · updated October 20, 2026</p>
<h2>1. Who can sell</h2><p>Anyone 18 or older with knowledge or skills other people find useful. You don’t need a degree, a title or a company. You do need to pass our application review and confirm your identity.</p>
<h2>2. A clear quote</h2><p>Every quote must say what will be delivered, in what format, the deadline and how many rounds of changes are included. It’s the basis for resolving disputes.</p>
<h2>3. Not allowed</h2><ul><li>Asking for payment, transfers or contact details to pay outside Kennismarket.</li><li>Promising guaranteed profit, income or results.</li><li>Selling content you don’t have the rights to.</li><li>Buying, trading or faking reviews and sales.</li></ul>
<h2>4. Service</h2><p>Reply to messages within 24 hours and meet the deadlines you agree to. Frequent delays reduce your store’s visibility and can cost you the badge.</p>
<h2>5. Getting paid</h2><ul><li>KN Coins approved by the buyer can be converted after 7 days.</li><li>Kennismarket service fee: 15% of the converted amount.</li><li>Money is sent to an account in the seller’s own name.</li></ul>
<h2>6. Penalties</h2><p>Warning, temporary suspension, loss of the “Verified” badge or closure of the store, depending on how serious and how frequent the problem is.</p>`,
es:`<p class="ver">Borrador · actualizado el 20 de octubre de 2026</p>
<h2>1. Quién puede vender</h2><p>Cualquier persona de 18 años o más con conocimientos o habilidades útiles para otros. No necesitas título ni empresa. Sí necesitas pasar la revisión de solicitud y confirmar tu identidad.</p>
<h2>2. Una propuesta clara</h2><p>Toda propuesta debe decir qué se entregará, en qué formato, el plazo y cuántas rondas de cambios incluye. Es la base para resolver disputas.</p>
<h2>3. No está permitido</h2><ul><li>Pedir pagos, transferencias o datos de contacto para pagar fuera de Kennismarket.</li><li>Prometer ganancias, ingresos o resultados garantizados.</li><li>Vender contenido sin tener los derechos.</li><li>Comprar, intercambiar o falsificar reseñas y ventas.</li></ul>
<h2>4. Atención</h2><p>Responde los mensajes en hasta 24 horas y cumple los plazos acordados. Los retrasos frecuentes reducen la visibilidad de tu tienda y pueden hacerte perder el sello.</p>
<h2>5. Cómo cobras</h2><ul><li>Los KN Coins aprobados por el comprador se pueden convertir después de 7 días.</li><li>Comisión de servicio de Kennismarket: 15% del valor convertido.</li><li>El dinero se envía a una cuenta a nombre del vendedor.</li></ul>
<h2>6. Sanciones</h2><p>Advertencia, suspensión temporal, pérdida del sello “Verificada” o cierre de la tienda, según la gravedad y la reincidencia.</p>`,
pt:`<p class="ver">Rascunho · atualizado em 20/10/2026</p>
<h2>1. Quem pode vender</h2><p>Qualquer pessoa com 18 anos ou mais que tenha um conhecimento ou habilidade útil para outras pessoas. Não é preciso diploma, título nem empresa. É preciso passar pela análise da inscrição e confirmar a identidade.</p>
<h2>2. Proposta clara</h2><p>Toda proposta deve dizer o que será entregue, em qual formato, o prazo e quantas rodadas de ajuste estão incluídas. Ela é a base para resolver disputas.</p>
<h2>3. Proibido</h2><ul><li>Pedir pagamento, Pix ou contato para pagamento fora do Kennismarket.</li><li>Prometer lucro, renda ou resultado garantido.</li><li>Vender conteúdo sem ter os direitos sobre ele.</li><li>Comprar, trocar ou forjar avaliações e vendas.</li></ul>
<h2>4. Atendimento</h2><p>Responder às mensagens em até 24 horas e cumprir os prazos combinados. Atrasos frequentes reduzem a visibilidade da loja e podem levar à perda do selo.</p>
<h2>5. Recebimento</h2><ul><li>Os KN Coins aprovados pelo comprador ficam disponíveis para conversão após 7 dias.</li><li>Taxa de serviço do Kennismarket: 15% sobre o valor convertido.</li><li>O dinheiro é enviado para uma conta em nome do próprio vendedor.</li></ul>
<h2>6. Penalidades</h2><p>Aviso, suspensão temporária, perda do selo “Verificada” ou encerramento da loja, conforme a gravidade e a reincidência.</p>`}}
};

DOCS.termos.h.nl=`<p class="ver">Concept · bijgewerkt op 20 oktober 2026</p>
<p class="draft">Concept voor juridische controle vóór publicatie. Gemarkeerde velden moeten nog worden ingevuld.</p>
<h2>1. Wat Kennismarket is</h2>
<p>Kennismarket is een online marktplaats waar mensen en bedrijven (“Kopers”) kennis, diensten en digitale inhoud kopen van zelfstandige personen (“Verkopers”). Kennismarket wordt geëxploiteerd door ${PH("bedrijfsnaam")}, KvK-nummer ${PH("nummer")}, ${PH("adres")}, bereikbaar via ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}.</p>
<p>Kennismarket faciliteert de aankoop en bewaart de KN Coins tot elke bestelling is afgerond. Verkopers leveren de diensten en zijn verantwoordelijk voor wat zij aanbieden en leveren.</p>
<h2>2. Je account</h2>
<ul><li>Je moet 18 jaar of ouder zijn en handelingsbekwaam.</li><li>De gegevens die je opgeeft, moeten kloppen en actueel blijven.</li><li>Eén account per persoon. Je bent zelf verantwoordelijk voor een veilig wachtwoord.</li><li>We kunnen je vragen je identiteit te bevestigen voor veiligheid en fraudepreventie.</li></ul>
<h2>3. KN Coins</h2>
<ul><li>Met KN Coins betaal je op Kennismarket. 1 KN Coin staat gelijk aan € 1,00.</li><li>KN Coins koop je met iDEAL, kaart, PayPal of Pix via ${"Asaas"}. Betaal je in een andere valuta, dan zie je de wisselkoers vóór de betaling.</li><li>KN Coins zijn geen geld, geen belegging en geen financieel product. Ze leveren geen rente op en zijn alleen te gebruiken op Kennismarket.</li><li>Ongebruikte KN Coins kun je terugvragen volgens het Terugbetalingsbeleid.</li></ul>
<h2>4. Hoe een bestelling werkt</h2>
<ul><li><b>Reservering:</b> de Koper reserveert KN Coins om te beginnen. Gereserveerde KN Coins staan in de Kennismarket-garantie: ze gaan van het beschikbare saldo af, maar niet naar de Verkoper.</li>
<li><b>Voorstel:</b> de Verkoper stuurt in de chat een voorstel met opties, de prijs in KN Coins, wat er wordt geleverd en de termijn.</li>
<li><b>Keuze:</b> kiest de Koper een optie, dan blijft die prijs beschermd in de Kennismarket-garantie en gaat het verschil terug naar het saldo van de Koper.</li>
<li><b>Levering:</b> zodra de Verkoper levert wat de Koper koos, worden de KN Coins vrijgegeven en verdeeld tussen de Verkoper en Kennismarket. Vanaf dat moment is terugbetaling niet meer automatisch: de Koper kan binnen 7 dagen een supportzaak openen, en het Kennismarket-team beoordeelt die.</li>
<li>Het in de chat geaccepteerde voorstel bepaalt wat er is gekocht en vormt de basis voor de beoordeling van geschillen.</li></ul>
<h2>5. Gedragsregels</h2>
<p>Op Kennismarket is het verboden om:</p>
<ul><li>betalingen buiten het platform af te spreken of daarvoor contactgegevens uit te wisselen;</li><li>gegarandeerde winst, inkomsten of financiële resultaten te beloven;</li><li>inhoud te verkopen waarvan je de rechten niet hebt, zoals e-books van andere auteurs;</li><li>piramidespelen, gokken, beleggingen of illegale producten aan te bieden;</li><li>beledigende, discriminerende of misleidende inhoud te plaatsen, of inhoud die inbreuk maakt op rechten van anderen;</li><li>nepaccounts aan te maken of reviews en verkoopcijfers te manipuleren.</li></ul>
<p>Overtreding kan leiden tot een waarschuwing, schorsing of opheffing van het account, onverminderd andere juridische maatregelen.</p>
<h2>6. Verkopers</h2>
<ul><li>Iedereen van 18 jaar of ouder kan zich aanmelden als verkoper. Een diploma of bedrijf is niet nodig. Elke aanmelding wordt beoordeeld, inclusief de identiteit.</li><li>Het keurmerk “Geverifieerd” betekent dat de identiteit van de winkel is bevestigd, dat er minimaal 10 afgeronde verkopen zijn en dat de gemiddelde beoordeling 4,5 of hoger is. Het keurmerk is geen garantie op resultaat.</li><li>Ontvangen KN Coins kunnen in de verkopersomgeving worden omgezet in geld, met servicekosten van 15%, zoals beschreven in de Regels voor verkopers.</li><li>Verkopers zijn zelf verantwoordelijk voor hun belastingen, facturen en wettelijke verplichtingen in hun land.</li></ul>
<h2>7. Garantie voor verkopers</h2>
<p>Als een Koper ontvangt wat hij heeft besteld en daarna probeert niet te betalen — bijvoorbeeld door de kaartbetaling te betwisten (chargeback), zijn bank om een onterechte terugboeking te vragen of betaalgegevens van iemand anders te gebruiken — betaalt Kennismarket de Verkoper zijn deel van de bestelling, zolang de levering via het platform is gedaan en overeenkomt met wat is afgesproken. De Verkoper hoeft de Koper niet zelf achterna te zitten: Kennismarket neemt de inning over.</p>
<p>Een product of dienst ontvangen en te kwader trouw weigeren te betalen kan een strafbaar feit zijn (zoals oplichting) en is een schending van deze voorwaarden. In die gevallen kan Kennismarket het account van de Koper opschorten of sluiten, het bewijs bewaren (chat, leveringen en betalingen) en passende juridische stappen nemen, waaronder aangifte bij de autoriteiten, om het bedrag terug te krijgen.</p>
<h2>8. Geschillen</h2>
<p>Een geschil kan worden geopend binnen 7 dagen na de levering. Het Kennismarket-team bekijkt het geaccepteerde voorstel, het gesprek en de levering, kan beide partijen om informatie vragen en beslist binnen 5 werkdagen: volledige, gedeeltelijke of geen terugbetaling aan de Koper (terugbetalingen na levering worden door Kennismarket betaald). Een levering die overeenkomt met het geaccepteerde voorstel niet mooi vinden, is op zichzelf geen reden voor terugbetaling.</p>
<h2>9. Verantwoordelijkheden van Kennismarket</h2>
<p>Kennismarket beheert het platform, bewaart KN Coins tijdens elke bestelling, behandelt geschillen en beschermt persoonsgegevens. Kennismarket garandeert geen financiële of zakelijke resultaten van de gekochte diensten.</p>
<h2>10. Intellectueel eigendom</h2>
<p>De gebruiksrechten op geleverde inhoud zijn de rechten die in het voorstel staan. Tenzij anders afgesproken, krijgt de Koper een licentie voor eigen gebruik of gebruik in het eigen bedrijf, zonder recht op doorverkoop.</p>
<h2>11. Wijzigingen</h2>
<p>We kunnen deze voorwaarden wijzigen. We laten dat minstens 15 dagen van tevoren weten per e-mail en op de site. Wijzigingen gelden niet voor bestellingen die al lopen.</p>
<h2>12. Toepasselijk recht</h2>
<p>Op deze voorwaarden is Nederlands recht van toepassing. Niets in deze voorwaarden beperkt de dwingende consumentenrechten die je hebt in het land waar je woont, zoals de Europese consumentenregels.</p>`;
DOCS.reembolso.h.nl=`<p class="ver">Concept · bijgewerkt op 20 oktober 2026</p>
<div class="sum"><b>Samenvatting</b><span>Je raakt nooit KN Coins kwijt aan een dienst die je niet hebt ontvangen. KN Coins die je nog niet hebt gebruikt, kun je terugvragen als geld, en verkopers krijgen pas betaald als ze leveren wat je hebt gekozen.</span></div>
<h2>1. KN Coins die je nog niet hebt gebruikt</h2>
<div class="tablewrap"><table><thead><tr><th>Wanneer</th><th>Wat er gebeurt</th></tr></thead><tbody>

<p style="margin-top:10px">De termijn van 14 dagen voldoet aan de wettelijke bedenktijd in de Europese Unie. Je vraagt een terugbetaling aan via <b>Portemonnee → Terugbetaling aanvragen</b>. Support beoordeelt elke aanvraag en controleert of de KN Coins niet zijn gebruikt, om verkopers tegen fraude te beschermen.</p>
<h2>2. KN Coins gereserveerd bij een winkel</h2>
<ul><li><b>Voordat je een optie uit het voorstel kiest:</b> annuleer wanneer je wilt. De KN Coins gaan direct terug naar je saldo.</li><li><b>Nadat je hebt gekozen:</b> verloopt de levertermijn zonder levering, dan kun je de bestelling annuleren en krijg je de KN Coins terug.</li></ul>
<h2>3. Levering niet zoals afgesproken</h2>
<p>Open binnen 7 dagen na de levering een geschil. De KN Coins blijven tijdens de beoordeling vastgezet. Het Kennismarket-team beslist binnen 5 werkdagen. Komt de levering niet overeen met het geaccepteerde voorstel, dan krijg je de KN Coins geheel of gedeeltelijk terug.</p>
<h2>4. Wanneer er geen terugbetaling is</h2>
<p>KN Coins die bij de levering aan de verkoper zijn vrijgegeven, tenzij support een terugbetaling goedkeurt na beoordeling van een zaak die binnen 7 dagen na de levering is geopend. Dit beperkt geen dwingende consumentenrechten die je hebt in het land waar je woont.</p>
<p class="fineprint">Een levering die overeenkomt met het geaccepteerde voorstel niet mooi vinden, is op zichzelf geen reden voor terugbetaling. In zulke gevallen beoordeelt support elke aanvraag afzonderlijk, op basis van het voorstel, het gesprek en wat er is geleverd, en kan besluiten tot volledige, gedeeltelijke of geen terugbetaling. Accounts die herhaaldelijk om terugbetaling vragen na ontvangst van leveringen, kunnen beperkt worden in nieuwe reserveringen.</p>
<h2>5. Hoe en wanneer je het geld krijgt</h2>
<ul><li>Terugbetalingen gaan naar de betaalmethode van de aankoop, in de valuta waarin je betaalde.</li><li><b>iDEAL en Pix:</b> binnen 2 werkdagen.</li><li><b>Kaart en PayPal:</b> we zetten de terugbetaling binnen 2 werkdagen in gang. Wanneer die zichtbaar is, hangt af van je aanbieder.</li></ul>
<h2>6. Contact</h2><p>Vragen over terugbetalingen: ${`<a href="mailto:kennismarket.support@protonmail.com">kennismarket.support@protonmail.com</a>`}.</p>`;
DOCS.privacidade.h.nl=`<p class="ver">Concept · bijgewerkt op 20 oktober 2026 · opgesteld volgens de AVG (GDPR)</p>
<p class="draft">Concept voor juridische controle. Vul vóór publicatie de verwerkingsverantwoordelijke en de functionaris gegevensbescherming in.</p>

/* =========================================================
   Arquivos de entrega reais (assets + db do artifact)
   Cada item de entrega tem uma chave por idioma; o arquivo anexado
   fica salvo no artifact e aparece para todo mundo.
   ========================================================= */
let FILES={},FDB=null,FASSETS=null;
const fhash=s=>{let h=5381;for(const ch of String(s))h=((h<<5)+h+ch.charCodeAt(0))>>>0;return h.toString(36)};
const fkey=(names,lg)=>"f-"+fhash(Array.isArray(names)?names[0]:names)+"-"+lg;
const fsize=b=>b>=1048576?(b/1048576).toLocaleString(loc(),{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(b/1024))+" KB";
const FTYPES={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",txt:"text/plain",csv:"text/csv",md:"text/markdown",json:"application/json"};
const FACCEPT=Object.keys(FTYPES).map(x=>"."+x).join(",");

/* Um item de entrega: arquivo real se houver, senão o botão de demonstração.
   ic = ícone, names = [en,es,pt,nl,de], lg = idioma do arquivo, sub = texto extra */
function fileItem(ic,names,lg,sub){
  const k=fkey(names,lg),f=FILES[k],label=esc(L(names,lg))+(sub?` <em class="fsub">${esc(sub)}</em>`:"");
  const up=FASSETS?`<button class="fattach" data-a="fattach" data-k="${k}" data-lg="${lg}" data-n="${esc(Array.isArray(names)?names[0]:names)}" title="${esc(f?tr("fReplace"):tr("fAttach"))}" aria-label="${esc(f?tr("fReplace"):tr("fAttach"))}">${icon(f?"refund":"link",15)}</button>`:"";
  if(f) return `<div class="fwrap"><a class="fileitem real" href="/_blob/${esc(f.asset)}" target="_blank" rel="noopener">${icon(ic,16)}<span>${label}</span><small>${esc((f.ext||"").toUpperCase())} · ${fsize(f.size||0)}</small>${icon("send",14)}</a>${up}</div>`;
  return `<div class="fwrap"><button class="fileitem" data-a="file">${icon(ic,16)}<span>${label}</span></button>${up}</div>`;
}
/* ---------- Arquivos por produto (produtos prontos) ----------
   Cada produto tem a sua lista de arquivos por idioma. O nome do arquivo
   vira o nome do item. Sem arquivos, aparecem os itens genéricos. */
const pkey=p=>"p"+(p.id||fhash(p.name[0]));
const baseName=n=>String(n||"").replace(/\.[^.]+$/,"").replace(/[_]+/g," ").trim()||String(n||"");
const hidKey=(p,lg)=>"h-"+pkey(p)+"-"+lg;
const hiddenFor=(p,lg)=>{const d=FILES[hidKey(p,lg)];return d&&Array.isArray(d.hidden)?d.hidden:[]};
const genItems=(p,lg)=>{const h=hiddenFor(p,lg);return p.deliv.map((d,k)=>[d,k]).filter(([,k])=>!h.includes(k))};
async function hideGeneric(p,lg,k,undo){
  if(!FDB)return toast(tr("fNoDb"));
  const h=hiddenFor(p,lg).filter(x=>x!==k);if(!undo)h.push(k);
  try{await FDB.doc("delivfiles/"+hidKey(p,lg)).set({hidden:h,ts:Date.now()});toast(tr(undo?"fRestored":"fRemoved"))}catch(e){toast(tr("fErr"))}
}
function prodFiles(p,lg){const k=pkey(p);return Object.entries(FILES).filter(([,d])=>d.pkey===k&&d.lg===lg).sort((a,b)=>(a[1].ts||0)-(b[1].ts||0)).map(([id,d])=>({id,...d}))}
const extIcon=e=>["mp4","webm"].includes(e)?"video":"file";
function prodChips(p,i,s,lg,ctx){
  lg=lg||slang(s);ctx=ctx||"";const ed=!!(FASSETS&&(ctx||(s&&s.mine))),fl=prodFiles(p,lg),cx=`data-ctx="${ctx}" data-lg="${lg}"`;
  const chips=fl.length?fl.map(x=>`<i class="pchip has">${ed?`<a class="popen" href="${esc(x.link||"/_blob/"+x.asset)}" target="_blank" rel="noopener" title="${esc(tr("fOpen"))}">${icon(x.link?"link":extIcon(x.ext),13)} ${esc(x.link?x.name:baseName(x.name))} ${icon("send",11)}</a>`:`${icon(x.link?"link":extIcon(x.ext),13)} ${esc(x.link?x.name:baseName(x.name))}`}${ed?`<button type="button" class="pchip-b" data-a="fremove" data-k="${x.id}" title="${esc(tr("fRemove"))}" aria-label="${esc(tr("fRemove"))}">×</button>`:""}</i>`).join("")
    :genItems(p,lg).map(([[ic,n],k])=>`<i class="${ed?"pchip":""}">${icon(ic,13)} ${esc(L(n,s))}${ed?`<button type="button" class="pchip-b" data-a="ghide" ${cx} data-p="${i}" data-k="${k}" title="${esc(tr("fRemove"))}" aria-label="${esc(tr("fRemove"))}">×</button>`:""}</i>`).join("")
      +(ed&&hiddenFor(p,lg).length?`<button type="button" class="prestore" data-a="gshow" ${cx} data-p="${i}">${tr("fRestore",{n:hiddenFor(p,lg).length})}</button>`:"");
  const drop=ed?`<button type="button" class="pdrop" data-a="pattach" ${cx} data-p="${i}">${icon("file",14)} ${tr(fl.length?"fAddMore":"fAddFiles",{l:langName(lg)})}</button><button type="button" class="pdrop plink" data-a="paddlink" ${cx} data-p="${i}">${icon("link",14)} ${tr("fAddLink")}</button>`:"";
  return chips+drop;
}
/* Itens de entrega de um produto (comprador e vendedor) */
function prodDeliv(p,lg,sub){
  const fl=prodFiles(p,lg);
  if(fl.length) return fl.map(x=>realFile(x,sub)).join("");
  return genItems(p,lg).map(([[ic,n]])=>fileItem(ic,n,lg,sub)).join("");

function realFile(x,sub){

  return `<div class="fwrap"><a class="fileitem real" href="/_blob/${esc(x.asset)}" target="_blank" rel="noopener">${icon(extIcon(x.ext),16)}<span>${esc(baseName(x.name))}${sub?` <em class="fsub">${esc(sub)}</em>`:""}</span><small>${esc((x.ext||"").toUpperCase())} · ${fsize(x.size||0)}</small>${icon("send",14)}</a></div>`}
function addLink(p,lg){
  if(!FDB)return toast(tr("fNoDb"));
  modal(`<h2>${tr("fLinkT")}</h2><p class="sub">${tr("fLinkD",{l:langName(lg)})}</p>
    <div class="field"><label for="lk-n">${tr("fLinkN")}</label><input id="lk-n" placeholder="${esc(tr("fLinkNPh"))}"></div>
    <div class="field"><label for="lk-u">URL</label><input id="lk-u" type="url" placeholder="https://"></div><p class="err" id="lk-err"></p>
    <button class="btn primary block" id="ok">${tr("fLinkB")}</button><button class="btn block" data-a="close">${tr("back2")}</button>`,m=>{m.querySelector("#ok").onclick=async()=>{
      const n=m.querySelector("#lk-n").value.trim(),u=m.querySelector("#lk-u").value.trim();
      if(!/^https?:\/\/\S+\.\S+/.test(u)){m.querySelector("#lk-err").textContent=tr("fLinkErr");return}
      closeModal();
      try{await FDB.doc("delivfiles/p-"+fhash(pkey(p))+"-"+lg+"-"+Date.now().toString(36)).set({pkey:pkey(p),lg,link:u,name:n||u.replace(/^https?:\/\//,"").slice(0,60),ts:Date.now()});toast(tr("fLinkOk"))}catch(e){toast(tr("fErr"))}}})
}
async function uploadMany(list,p,lg){
  if(!FDB||!FASSETS)return toast(tr(FDB?"fNoUp":"fNoDb"));
  const files=[...list];if(!files.length)return;
  let ok=0,bad=0;toast(tr("fUploadingN",{n:files.length}));
  for(const file of files){
    const ext=(file.name.split(".").pop()||"").toLowerCase(),type=FTYPES[ext];
    if(!type||file.size>20*1048576){bad++;continue}
    try{const r=await FASSETS.upload(file,{type});
      const id="p-"+fhash(pkey(p))+"-"+lg+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await FDB.doc("delivfiles/"+id).set({pkey:pkey(p),lg,asset:r.id,ext,size:r.sizeBytes,name:file.name,ts:Date.now()});ok++}
    catch(e){bad++}
  }
  toast(bad?tr("fSomeBad",{a:ok,b:bad}):tr("fSavedN",{n:ok}));
}
function pickMany(p,lg){const inp=document.createElement("input");inp.type="file";inp.multiple=true;inp.accept=FACCEPT;inp.onchange=()=>uploadMany(inp.files,p,lg);inp.click()}
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest(".pdrop");if(z){e.preventDefault();z.classList.add("over")}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest(".pdrop");if(z)z.classList.remove("over")});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest(".pdrop");if(!z)return;e.preventDefault();z.classList.remove("over");const s=z.dataset.ctx==="ed"?edStore():shopById(S.shopId);if(!s||!s.prods)return;uploadMany(e.dataTransfer.files,s.prods[+z.dataset.p],z.dataset.lg||slang(s))});
function refreshProdPanel(){

async function filesInit(){
  try{
    if(!window.claude||!window.claude.use)return;
